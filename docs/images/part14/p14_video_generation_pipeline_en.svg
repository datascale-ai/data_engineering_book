<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="760" viewBox="0 0 1760 760" role="img" aria-labelledby="title desc">
  <title id="title">Video generation data pipeline</title>
  <desc id="desc">English-labeled architecture diagram for the P14 video generation data pipeline, covering source loading, scene detection, motion filtering, aesthetic scoring, VLM captioning, shot-language tagging, and final T2V manifest generation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
    <style>
      text {
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        fill: #0f172a;
      }
      .box {
        fill: #f8fafc;
        stroke: #334155;
        stroke-width: 2;
        rx: 10;
      }
      .box-blue {
        fill: #eff6ff;
        stroke: #2563eb;
        stroke-width: 2;
        rx: 10;
      }
      .box-green {
        fill: #ecfdf5;
        stroke: #059669;
        stroke-width: 2;
        rx: 10;
      }
      .box-amber {
        fill: #fffbeb;
        stroke: #d97706;
        stroke-width: 2;
        rx: 10;
      }
      .title {
        font-size: 30px;
        font-weight: 800;
        text-anchor: middle;
      }
      .node-title {
        font-size: 22px;
        font-weight: 750;
        text-anchor: middle;
      }
      .node-sub {
        font-size: 16px;
        text-anchor: middle;
        fill: #475569;
      }
      .small {
        font-size: 15px;
        fill: #334155;
      }
      .arrow {
        stroke: #334155;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
      .dash {
        stroke: #64748b;
        stroke-width: 2;
        stroke-dasharray: 7 7;
        fill: none;
        marker-end: url(#arrow);
      }
      .lane {
        fill: #ffffff;
        stroke: #e2e8f0;
        stroke-width: 2;
        rx: 12;
      }
      .lane-label {
        font-size: 19px;
        font-weight: 750;
        fill: #334155;
      }
    </style>
  </defs>

  <rect width="1760" height="760" fill="#ffffff" />
  <text class="title" x="880" y="48">P14 Video Generation Data Pipeline</text>
  <text class="node-sub" x="880" y="78">from licensed source videos to auditable text-to-video training samples</text>

  <rect class="lane" x="40" y="115" width="1680" height="240" />
  <text class="lane-label" x="65" y="150">Stage manifests</text>

  <rect class="box-blue" x="80" y="190" width="190" height="92" />
  <text class="node-title" x="175" y="220">Source Load</text>
  <text class="node-sub" x="175" y="248">Pexels manifest</text>
  <text class="node-sub" x="175" y="272">ffprobe metadata</text>

  <rect class="box-blue" x="320" y="190" width="190" height="92" />
  <text class="node-title" x="415" y="220">Scene Detect</text>
  <text class="node-sub" x="415" y="248">single-shot clips</text>
  <text class="node-sub" x="415" y="272">shot_id timeline</text>

  <rect class="box-green" x="560" y="190" width="190" height="92" />
  <text class="node-title" x="655" y="220">Motion Filter</text>
  <text class="node-sub" x="655" y="248">optical flow</text>
  <text class="node-sub" x="655" y="272">pass_motion</text>

  <rect class="box-green" x="800" y="190" width="190" height="92" />
  <text class="node-title" x="895" y="220">Aesthetic Score</text>
  <text class="node-sub" x="895" y="248">CLIP + MLP</text>
  <text class="node-sub" x="895" y="272">pass_aesthetic</text>

  <rect class="box-amber" x="1040" y="190" width="190" height="92" />
  <text class="node-title" x="1135" y="220">VLM Caption</text>
  <text class="node-sub" x="1135" y="248">multi-frame prompt</text>
  <text class="node-sub" x="1135" y="272">caption_en</text>

  <rect class="box-amber" x="1280" y="190" width="190" height="92" />
  <text class="node-title" x="1375" y="220">Shot Tags</text>
  <text class="node-sub" x="1375" y="248">controlled vocab</text>
  <text class="node-sub" x="1375" y="272">camera motion</text>

  <rect class="box" x="1520" y="190" width="160" height="92" />
  <text class="node-title" x="1600" y="220">T2V Manifest</text>
  <text class="node-sub" x="1600" y="248">JSONL / shards</text>
  <text class="node-sub" x="1600" y="272">audit fields</text>

  <path class="arrow" d="M270 236 H320" />
  <path class="arrow" d="M510 236 H560" />
  <path class="arrow" d="M750 236 H800" />
  <path class="arrow" d="M990 236 H1040" />
  <path class="arrow" d="M1230 236 H1280" />
  <path class="arrow" d="M1470 236 H1520" />

  <rect class="lane" x="40" y="405" width="1680" height="250" />
  <text class="lane-label" x="65" y="440">Engineering controls</text>

  <rect class="box" x="95" y="485" width="250" height="100" />
  <text class="node-title" x="220" y="516">Resume Safety</text>
  <text class="node-sub" x="220" y="544">repair_tail / done ids</text>
  <text class="node-sub" x="220" y="568">per-stage JSONL append</text>

  <rect class="box" x="395" y="485" width="250" height="100" />
  <text class="node-title" x="520" y="516">Shard Execution</text>
  <text class="node-sub" x="520" y="544">CPU workers / GPU shards</text>
  <text class="node-sub" x="520" y="568">deterministic modulo split</text>

  <rect class="box" x="695" y="485" width="250" height="100" />
  <text class="node-title" x="820" y="516">OOM Degradation</text>
  <text class="node-sub" x="820" y="544">batch / frame / long-edge</text>
  <text class="node-sub" x="820" y="568">safe_call fallback policy</text>

  <rect class="box" x="995" y="485" width="250" height="100" />
  <text class="node-title" x="1120" y="516">Evidence Assets</text>
  <text class="node-sub" x="1120" y="544">frames, logs, scores</text>
  <text class="node-sub" x="1120" y="568">caption and tag traces</text>

  <rect class="box" x="1295" y="485" width="250" height="100" />
  <text class="node-title" x="1420" y="516">Release Gates</text>
  <text class="node-sub" x="1420" y="544">license, safety, quality</text>
  <text class="node-sub" x="1420" y="568">sampling and audit review</text>

  <path class="dash" d="M220 485 V330 H175" />
  <path class="dash" d="M520 485 V330 H415" />
  <path class="dash" d="M820 485 V330 H895" />
  <path class="dash" d="M1120 485 V330 H1135" />
  <path class="dash" d="M1420 485 V330 H1600" />

  <text class="small" x="80" y="700">Output contract: source_videos.jsonl -> stage2_scenes.jsonl -> stage3_motion.jsonl -> stage4_aesthetic.jsonl -> stage5_captions.jsonl -> stage6_shot_language.jsonl -> final manifest.</text>
</svg>
